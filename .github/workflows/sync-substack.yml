name: Sync Substack

permissions:
  contents: write

on:
  schedule:
    # 09:20 UTC daily — an off-the-hour minute, since GitHub drops scheduled
    # runs that pile up on :00.
    - cron: "20 9 * * *"
  workflow_dispatch:

# A long-running sync should never race a manual one.
concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror Substack posts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "📥 Pull posts from Substack"
        run: npm run sync:substack

      - name: "🔨 Verify the site still builds"
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: "📤 Commit any new or changed posts"
        run: |
          set -euo pipefail
          # --porcelain rather than `git diff`, so brand-new (untracked) posts
          # and images count as changes too.
          if [ -z "$(git status --porcelain -- src/content/posts src/assets/writings)" ]; then
            echo "No Substack changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts src/assets/writings
          git commit -m "Sync writings from Substack"
          git push
